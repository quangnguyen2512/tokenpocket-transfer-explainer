    <text x="64" y="874" fill="#64748B" font-size="13.5">Official Video Tutorial: <tspan fill="#93C5FD" font-family="'Cascadia Code', Consolas, monospace">x.com/TokenPocket_TP/status/2118610097987596552</tspan>   ·   Docs: <tspan fill="#94A3B8">help.tokenpocket.pro</tspan></text>

    <!-- Slide Dots -->
    <circle cx="1474" cy="869" r="5" fill="#3B9EFF"/>
    <circle cx="1494" cy="869" r="4" fill="#334155"/>
    <circle cx="1512" cy="869" r="4" fill="#334155"/>
    <circle cx="1530" cy="869" r="4" fill="#334155"/>
