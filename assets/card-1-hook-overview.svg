      <stop offset="55%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#09101E"/>
    </linearGradient>
    <radialGradient id="glowSol" cx="25%" cy="62%" r="38%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#9945FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060A14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTrx" cx="76%" cy="62%" r="38%">
      <stop offset="0%" stop-color="#FF2E4D" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#FF7B54" stop-opacity="0.05"/>
