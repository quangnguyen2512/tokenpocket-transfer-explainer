      <text x="32" y="140" fill="#F8FAFC" font-size="13.5" font-weight="700">SOL (Default)</text>
      <rect x="150" y="124" width="74" height="22" rx="11" fill="#14F195"/>
      <text x="187" y="139" text-anchor="middle" fill="#041E16" font-size="11" font-weight="800">Gas-Free</text>

      <rect x="18" y="162" width="216" height="38" rx="9" fill="#101D33" stroke="#1E3A5F"/>
      <text x="32" y="186" fill="#CBD5E1" font-size="13.5" font-weight="600">USDT</text>
      <rect x="150" y="170" width="74" height="22" rx="11" fill="#14F195" fill-opacity="0.22" stroke="#14F195"/>
      <text x="187" y="185" text-anchor="middle" fill="#14F195" font-size="11" font-weight="800">Gas-Free</text>

      <rect x="18" y="208" width="216" height="38" rx="9" fill="#101D33" stroke="#1E3A5F"/>
      <text x="32" y="232" fill="#CBD5E1" font-size="13.5" font-weight="600">USDC</text>
      <rect x="150" y="216" width="74" height="22" rx="11" fill="#14F195" fill-opacity="0.22" stroke="#14F195"/>
      <text x="187" y="231" text-anchor="middle" fill="#14F195" font-size="11" font-weight="800">Gas-Free</text>

      <text x="18" y="280" fill="#CBD5E1" font-size="13">SOL, USDT &amp; USDC fee</text>
      <text x="18" y="298" fill="#CBD5E1" font-size="13">options all display</text>
      <text x="18" y="316" fill="#14F195" font-size="13" font-weight="800">"Gas-Free" while daily</text>
      <text x="18" y="334" fill="#14F195" font-size="13" font-weight="800">3/day quota remains.</text>
    </g>

    <!-- Arrow 2->3 -->
    <line x1="1232" y1="476" x2="1252" y2="476" stroke="#14F195" stroke-width="2.5"/>
    <polygon points="1252,470 1262,476 1252,482" fill="#14F195"/>

    <!-- STEP 3 PHONE -->
    <g transform="translate(1268, 304)">
      <rect width="234" height="360" rx="24" fill="#080F1E" stroke="#2D4367" stroke-width="2"/>
      <rect x="77" y="10" width="80" height="8" rx="4" fill="#1E293B"/>
      <rect x="18" y="32" width="66" height="24" rx="12" fill="#2980FE" fill-opacity="0.24"/>
      <text x="51" y="48" text-anchor="middle" fill="#60A5FA" font-size="12" font-weight="800">STEP 3</text>
      <text x="18" y="80" fill="#F8FAFC" font-size="16" font-weight="800">Verify &amp; Confirm</text>

      <!-- Summary Box -->
      <rect x="18" y="98" width="198" height="106" rx="12" fill="#101D33" stroke="#1E3A5F"/>
      <text x="30" y="122" fill="#94A3B8" font-size="12">Amount</text>
      <text x="204" y="122" text-anchor="end" fill="#F8FAFC" font-size="13" font-weight="700">100 USDT</text>
      <line x1="30" y1="136" x2="204" y2="136" stroke="#1E293B"/>
      <text x="30" y="160" fill="#94A3B8" font-size="12">Network Fee</text>
      <text x="204" y="160" text-anchor="end" fill="#14F195" font-size="13.5" font-weight="800">Gas-Free</text>
      <line x1="30" y1="172" x2="204" y2="172" stroke="#1E293B"/>
      <text x="30" y="194" fill="#94A3B8" font-size="12">Daily Quota</text>
      <text x="204" y="194" text-anchor="end" fill="#93C5FD" font-size="12.5" font-weight="700">1 of 3 Used</text>

      <!-- Confirm CTA -->
      <rect x="18" y="224" width="198" height="44" rx="12" fill="url(#solBar)"/>
      <text x="117" y="251" text-anchor="middle" fill="#041310" font-size="14.5" font-weight="800">[Confirm]</text>

      <text x="18" y="298" fill="#CBD5E1" font-size="13">Verify the fee reads</text>
      <text x="18" y="316" fill="#14F195" font-size="13" font-weight="700">"Gas-Free"</text>
      <text x="86" y="316" fill="#CBD5E1" font-size="13">then tap</text>
      <text x="18" y="334" fill="#CBD5E1" font-size="13">[Confirm] to broadcast.</text>
    </g>

    <!-- Daily Quota Meter Bar -->
    <rect x="676" y="688" width="826" height="98" rx="14" fill="#0A1324" stroke="#1E3454"/>
    <text x="700" y="718" fill="#94A3B8" font-size="12.5" font-weight="800" letter-spacing="1.2">DAILY PER-ACCOUNT QUOTA VISUALIZER</text>

    <rect x="700" y="732" width="184" height="38" rx="9" fill="#0E2E2B" stroke="#14F195"/>
    <text x="792" y="756" text-anchor="middle" fill="#14F195" font-size="13.5" font-weight="800">#1 SPL → Gas-Free</text>

    <rect x="898" y="732" width="184" height="38" rx="9" fill="#0E2E2B" stroke="#14F195"/>
    <text x="990" y="756" text-anchor="middle" fill="#14F195" font-size="13.5" font-weight="800">#2 SPL → Gas-Free</text>

    <rect x="1096" y="732" width="184" height="38" rx="9" fill="#0E2E2B" stroke="#14F195"/>
    <text x="1188" y="756" text-anchor="middle" fill="#14F195" font-size="13.5" font-weight="800">#3 SPL → Gas-Free</text>

    <rect x="1294" y="732" width="188" height="38" rx="9" fill="#1B2233" stroke="#475569" stroke-dasharray="5,4"/>
    <text x="1388" y="756" text-anchor="middle" fill="#94A3B8" font-size="13" font-weight="700">#4+ → Standard Fee</text>

    <!-- Footer -->
    <line x1="64" y1="844" x2="1536" y2="844" stroke="#1E293B" stroke-width="1"/>
    <text x="64" y="874" fill="#64748B" font-size="13.5">Official Solana FAQ: <tspan fill="#93C5FD" font-family="'Cascadia Code', Consolas, monospace">help.tokenpocket.pro/en/wallet-faq-en/solana-wallet/gas-free-service-on-solana</tspan></text>

    <circle cx="1474" cy="869" r="4" fill="#334155"/>
    <circle cx="1494" cy="869" r="5" fill="#14F195"/>
    <circle cx="1512" cy="869" r="4" fill="#334155"/>
    <circle cx="1530" cy="869" r="4" fill="#334155"/>
  </g>
</svg>
